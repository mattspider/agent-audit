name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Expect exit 2 on insecure examples
        run: |
          set +e
          node packages/cli/dist/index.js scan examples/insecure
          code=$?
          set -e
          test "$code" -eq 2
      - name: Expect exit 0 on secure example
        run: |
          node packages/cli/dist/index.js scan examples/secure/mcp.json
          test $? -eq 0
